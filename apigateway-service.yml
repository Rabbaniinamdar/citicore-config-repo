spring:
  cloud:
    gateway:
      routes:

        # =====================================================
        # AUTH SERVICE
        # =====================================================
        - id: auth-service
          uri: http://auth-service-8081-tcp.citicore:8081
          predicates:
            - Path=/auth/**
            - Method=GET,POST
          filters:
            - RewritePath=/auth/(?<segment>.*), /api/v1/auth/${segment}

            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 4
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth


        # =====================================================
        # USER SERVICE
        # =====================================================
        - id: user-service
          uri: http://user-service-8082-tcp.citicore:8082
          predicates:
            - Path=/users/**
          filters:
            - RewritePath=/users/(?<segment>.*), /api/v1/users/${segment}

            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 4
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

            - name: CircuitBreaker
              args:
                name: userCircuitBreaker
                fallbackUri: forward:/fallback/users

            - name: Retry
              args:
                retries: 1
                methods: GET
                statuses:
                  - BAD_GATEWAY
                  - GATEWAY_TIMEOUT
                  - INTERNAL_SERVER_ERROR
                exceptions:
                  - java.util.concurrent.TimeoutException
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: true


        # =====================================================
        # ACCOUNT SERVICE
        # =====================================================
        - id: account-service
          uri: http://citicore-account-service-8083-tcp.citicore:8083
          predicates:
            - Path=/accounts/**
          filters:
            - RewritePath=/accounts/(?<segment>.*), /api/v1/accounts/${segment}

            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 4
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

            - name: CircuitBreaker
              args:
                name: accountCircuitBreaker
                fallbackUri: forward:/fallback/account

            - name: Retry
              args:
                retries: 1
                methods: GET
                statuses:
                  - BAD_GATEWAY
                  - GATEWAY_TIMEOUT
                  - INTERNAL_SERVER_ERROR
                exceptions:
                  - java.util.concurrent.TimeoutException
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: true