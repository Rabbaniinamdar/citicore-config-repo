jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1000000
  refresh-token-expiration: 604800000

server:
  error:
    include-message: always

spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: kyc-group
      auto-offset-reset: earliest
    admin:
      auto-create: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh

  endpoint:
    health:
      show-details: always

  metrics:
    enable:
      all: true

sendgrid:
  api-key: ${SEND_GRID_API_KEY}