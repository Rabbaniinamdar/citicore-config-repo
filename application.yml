# ─────────────────────────────────────────────────────────────
# application.yml — SHARED CONFIG (Config Server)
#
# Inherited by ALL services automatically.
# Service-specific files (auth-service.yml, user-service.yml etc.)
# only override what is DIFFERENT for that service.
#
# Spring Cloud Config resolution order (last wins):
#   1. application.yml          ← this file (lowest priority)
#   2. {service-name}.yml       ← service-specific overrides
#   3. {service-name}-{profile}.yml  ← profile overrides (highest)
# ─────────────────────────────────────────────────────────────

# ─── Eureka (same for every service) ─────────────────────────
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server-8761-tcp.citicore:8761/eureka
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# ─── JWT (same secret and expiry across all services) ─────────
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1000000       # ~16 minutes in ms
  refresh-token-expiration: 604800000    # 7 days in ms

  # ─── JPA defaults ──────────────────────────────────────────
spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mvc:
    throw-exception-if-no-handler-found: true

server:
  error:
    include-message: always
    include-binding-errors: always

# ─── Actuator (same exposure across all services) ─────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      show-details: always
  metrics:
    enable:
      all: true

# ─── Resilience4j defaults (used by gateway — safe to define globally) ──
resilience4j:
  timelimiter:
    instances:
      default:
        timeout-duration: 3s
  circuitbreaker:
    instances:
      default:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - java.util.concurrent.TimeoutException

# ─── Logging defaults ─────────────────────────────────────────
logging:
  level:
    root: INFO
    org.apache.kafka: WARN
    org.springframework.security: WARN
    org.springframework.kafka: INFO
    org.hibernate.SQL: WARN
    # overridden to DEBUG per service if needed
