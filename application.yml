  # ─── JPA defaults ──────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ─── SQL init ──────────────────────────────────────────────
  sql:
    init:
      mode: always

  # ─── Error response ────────────────────────────────────────
  mvc:
    throw-exception-if-no-handler-found: true

server:
  error:
    include-message: always
    include-binding-errors: always

# ─── AWS (shared region — bucket overridden per service) ──────
aws:
  region: ${AWS_REGION:ap-south-1}
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
  s3:
    bucket: ${S3_BUCKET:citicore-kyc-docs}

# ─── Actuator (same exposure across all services) ─────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      show-details: always
  metrics:
    enable:
      all: true

# ─── Resilience4j defaults (used by gateway — safe to define globally) ──
resilience4j:
  timelimiter:
    instances:
      default:
        timeout-duration: 3s
  circuitbreaker:
    instances:
      default:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - java.util.concurrent.TimeoutException

# ─── Logging defaults ─────────────────────────────────────────
logging:
  level:
    root: INFO
    org.apache.kafka: WARN
    org.springframework.security: WARN
    org.springframework.kafka: INFO
    org.hibernate.SQL: WARN               # overridden to DEBUG per service if needed