server:
  port: 8083

spring:
  application:
    name: account-service

  # ─── Disable Spring Boot auto DataSource config ───────────────
  # We define our own primary + replica DataSources manually.
  # Without this, Spring Boot tries to auto-configure a single
  # DataSource from spring.datasource.* and conflicts with ours.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

  # ─── PRIMARY MySQL (read + write) ─────────────────────────────
  datasource:
    primary:
      jdbc-url: jdbc:mysql://citicore-mysql-primary.cnk8ckkm2hsk.ap-south-1.rds.amazonaws.com:3306/citicore_account?useSSL=false&serverTimezone=UTC
      username: admin
      password: ${DB_PRIMARY_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
      # HikariCP — set in DataSourceConfig.java
      # maximumPoolSize: 10, minimumIdle: 3

    # ─── REPLICA MySQL (read only) ───────────────────────────────
    replica:
      jdbc-url: jdbc:mysql://citicore-mysql-replica.cnk8ckkm2hsk.ap-south-1.rds.amazonaws.com:3306/citicore_account?useSSL=false&serverTimezone=UTC
      username: ${DB_REPLICA_USERNAME}
      password: ${DB_PRIMARY_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
      # HikariCP — set in DataSourceConfig.java
      # maximumPoolSize: 20, minimumIdle: 5

  # ─── JPA / Hibernate ──────────────────────────────────────────
  jpa:
    # IMPORTANT: do NOT use create or create-drop in production.
    # Partitioned tables must be created via schema.sql manually.
    # Use 'validate' in production after schema is set up.
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        # Disable Hibernate's schema validation for partitioned tables
        # (Hibernate does not understand MySQL partition clauses)
        hbm2ddl:
          auto: none

  # ─── Schema init — runs schema.sql on startup ─────────────────
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      # schema.sql contains the partitioned CREATE TABLE statements

  # ─── Redis ────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:9092

  task:
    scheduling:
      pool:
        size: 2

# ─── Account business rules ───────────────────────────────────
citicore:
  account:
    min-savings-balance: 1000
    min-current-balance: 5000

# ─── Logging ──────────────────────────────────────────────────
logging:
  level:
    com.citicore.account: DEBUG
    org.springframework.data.redis: WARN
    org.apache.kafka: WARN
    # Enable to debug DataSource routing decisions:
    # com.citicore.account.config: TRACE
