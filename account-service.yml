# ─────────────────────────────────────────────────────────────
# account-service.yml — OVERRIDES ONLY
# Everything not listed here is inherited from application.yml
# ─────────────────────────────────────────────────────────────

server:
  port: 8083
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

spring:
  application:
    name: account-service

  # ─── Database (DEV: H2) ───────────────────────────────────
  datasource:
    url: jdbc:mysql://localhost:3306/accountdb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # ─── Kafka consumer group override ────────────────────────
  # Consumes: transfer-requested-topic, debit-success-topic,
  #           debit-failed-topic, credit-failed-topic, reversal-topic
  kafka:
    consumer:
      group-id: account-group

  # ─── Redis (balance cache — Cache-Aside pattern) ──────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # ─── Scheduling (AccountOutboxPublisher polls every 5s) ───
  task:
    scheduling:
      pool:
        size: 2

# ─── Account business rules ───────────────────────────────────
citicore:
  account:
    min-savings-balance: 1000
    min-current-balance: 5000

logging:
  level:
    com.citicore.account: DEBUG
    org.springframework.data.redis: WARN

