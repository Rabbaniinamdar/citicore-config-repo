# ─────────────────────────────────────────────────────────────
# auth-service.yml — OVERRIDES ONLY
# Everything not listed here is inherited from application.yml
# ─────────────────────────────────────────────────────────────

server:
  port: 8081

spring:
  application:
    name: auth-service

  # ─── Database (DEV: H2) ───────────────────────────────────
  datasource:
    url: jdbc:mysql://${AUTH_DB_HOST}:3306/citicore_authdb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  # auth-service only PRODUCES (otp-topic) — no consumer group needed
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

logging:
  level:
    com.citicore.auth: DEBUG

