server:
  port: 8081

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  application:
    name: auth-service

spring:
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driverClassName: org.h2.Driver
    username: sa
    password: password

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect  # H2-specific dialect
    hibernate:
      ddl-auto: update  # Automatically update the schema (for development)
    show-sql: true  # Show SQL queries in the console

  h2:
    console:
      enabled: true
      path: /h2-console

