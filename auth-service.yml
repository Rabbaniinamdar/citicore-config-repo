# ─────────────────────────────────────────────────────────────
# auth-service.yml — OVERRIDES ONLY
# Everything not listed here is inherited from application.yml
# ─────────────────────────────────────────────────────────────

server:
  port: 8081

spring:
  application:
    name: auth-service

  # ─── Database (DEV: H2) ───────────────────────────────────
  datasource:
    url: jdbc:mysql://localhost:3306/authdb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  # auth-service only PRODUCES (otp-topic) — no consumer group needed
  kafka:
    consumer:
      group-id: auth-group

logging:
  level:
    com.citicore.auth: DEBUG

