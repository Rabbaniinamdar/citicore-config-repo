# ─────────────────────────────────────────────────────────────
# user-service.yml — OVERRIDES ONLY
# Everything not listed here is inherited from application.yml
# ─────────────────────────────────────────────────────────────

server:
  port: 8082
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

spring:
  application:
    name: user-service

  # ─── Database (DEV: H2) ───────────────────────────────────
  datasource:
    url: jdbc:mysql://${AUTH_DB_HOST}:3306/citicore_userdb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # user-service only PRODUCES (kyc-topic) — no consumer needed
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: user-group

# ─── AWS (shared region — bucket overridden per service) ──────
aws:
  region: ${AWS_REGION:ap-south-1}
  s3:
    bucket: ${S3_BUCKET:citicore-kyc-docs}

# ─── KYC local upload dir (dev fallback) ─────────────────────
kyc:
  upload-dir: uploads/kyc/

logging:
  level:
    com.citicore.user: DEBUG

