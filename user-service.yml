server:
  port: 8082

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

spring:
  datasource:
    url: jdbc:h2:mem:userdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console


aws:
  region: ap-south-1
  s3:
    bucket: your-kyc-bucket

kyc:
  upload-dir: uploads/kyc/

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB