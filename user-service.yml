# ─────────────────────────────────────────────────────────────
# user-service.yml — OVERRIDES ONLY
# Everything not listed here is inherited from application.yml
# ─────────────────────────────────────────────────────────────

server:
  port: 8082
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

spring:
  application:
    name: user-service

  # ─── Database (DEV: H2) ───────────────────────────────────
  datasource:
    url: jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  # user-service only PRODUCES (kyc-topic) — no consumer needed
  kafka:
    consumer:
      group-id: user-group

# ─── KYC local upload dir (dev fallback) ─────────────────────
kyc:
  upload-dir: uploads/kyc/

logging:
  level:
    com.citicore.user: DEBUG

