# ─────────────────────────────────────────────────────────────
# notification-service.yml — OVERRIDES ONLY
# Everything not listed here is inherited from application.yml
# ─────────────────────────────────────────────────────────────

server:
  port: 8085

spring:
  application:
    name: notification-service

  # ─── Mail (Gmail SMTP) ────────────────────────────────────
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

  # ─── Kafka consumer group override ────────────────────────
  # Consumes: account-events-topic, credit-success-topic,
  #           credit-failed-topic, reversal-success-topic,
  #           otp-topic, kyc-topic
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: notification-group

# notification-service is stateless — no DB, no Redis needed
# Inherited kafka.producer config is used for DLQ publishing only

logging:
  level:
    com.citicore.notification: DEBUG
    org.springframework.mail: DEBUG   # set WARN in production