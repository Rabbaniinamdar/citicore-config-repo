# ─────────────────────────────────────────────────────────────
# transaction-service.yml — OVERRIDES ONLY
# Everything not listed here is inherited from application.yml
# ─────────────────────────────────────────────────────────────

server:
  port: 8084

spring:
  application:
    name: transaction-service

  # ─── MySQL ─────────────────────────────────────────────────
  datasource:
    url: jdbc:mysql://${TRANSACTION_DB_HOST}:3306/citicore_transactiondb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # ─── Kafka ─────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

    consumer:
      group-id: transaction-group

  # ─── Feign ─────────────────────────────────────────────────
  cloud:
    openfeign:
      client:
        config:
          account-service:
            connect-timeout: 3000
            read-timeout: 5000

  # ─── Scheduling ─────────────────────────────────────────────
  # OutboxPublisher polls every 5 seconds
  task:
    scheduling:
      pool:
        size: 2

# ─── Transaction business rules ───────────────────────────────
citicore:
  transaction:
    daily-limit:
      TRANSFER: 500000
      DEPOSIT: 1000000
      WITHDRAWAL: 200000

# ─── Logging ─────────────────────────────────────────────────
logging:
  level:
    com.citicore.transaction: DEBUG